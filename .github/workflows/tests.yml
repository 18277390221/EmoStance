name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy==2.2.6" "networkx==3.4.2" "pytest>=8"
      - name: Compile sources
        run: python -m compileall -q src scripts system_baseline human_ablation human_llm_emoji_audit data_eval rerank_efficiency
      - name: Run CPU unit tests
        env:
          PYTHONPATH: src
        run: pytest -q tests src/name_free_emoji_clustering/tests human_llm_emoji_audit/tests
